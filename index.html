<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGP工具箱</title>
    <!-- 极早期 splash：在 CSS 加载前立即显示渐变背景，彻底消灭白屏 -->
    <script>document.documentElement.style.cssText = 'height:100%;background:linear-gradient(135deg,#667eea,#764ba2)';</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; flex-direction: column; }
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 30px; color: white; }
        .header h1 { font-size: 24px; }
        .container { display: flex; flex: 1; padding: 20px; gap: 15px; height: calc(100vh - 60px); }
        .sidebar { width: 220px; background: white; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-title { font-size: 12px; color: #666; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
        .tool-btn { padding: 12px 16px; border: none; background: #f5f7fa; border-radius: 8px; cursor: pointer; font-size: 14px; color: #333; transition: all 0.2s; text-align: left; }
        .tool-btn:hover { transform: translateX(3px); background: #e8ecef; }
        .tool-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .main-content { flex: 1; display: flex; gap: 15px; }
        .panel { flex: 1; background: white; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .panel-title { font-size: 14px; font-weight: 600; color: #333; }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
        .btn-secondary { background: #f5f7fa; color: #333; }
        .btn-secondary:hover { background: #e8ecef; }
        textarea { flex: 1; width: 100%; border: 2px solid #e0e0e0; border-radius: 8px; padding: 12px; font-size: 13px; font-family: 'Consolas', 'Monaco', monospace; resize: none; line-height: 1.5; }
        textarea:focus { outline: none; border-color: #667eea; }
        .panel-actions { display: flex; gap: 8px; }
        .center-btn { display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .process-btn { padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .process-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102,126,234,0.4); }
        .process-btn:active { transform: translateY(0); }
        .csv-upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 20px; text-align: center; color: #888; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .csv-upload-area:hover { border-color: #667eea; color: #667eea; background: #f8f9ff; }
        .csv-upload-area.dragover { border-color: #667eea; background: #f0f2ff; }
        .csv-upload-area input[type="file"] { display: none; }
        .tool-panel { display: none; flex-direction: column; flex: 1; }
        .tool-panel.active { display: flex; }
        .input-mode-tabs { display: flex; gap: 0; margin-bottom: 10px; }
        .mode-tab { padding: 6px 14px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .mode-tab:first-child { border-radius: 6px 0 0 6px; }
        .mode-tab:last-child { border-radius: 0 6px 6px 0; }
        .mode-tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-color: #667eea; }
        .csv-file-info { font-size: 12px; color: #666; margin-bottom: 8px; }
        .download-btn { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .download-btn:hover { background: #218838; }
        .download-btn:disabled { background: #ccc; cursor: not-allowed; }
        .diff-added { background-color: #d4edda; color: #155724; padding: 2px 4px; border-radius: 3px; }
        .diff-removed { background-color: #f8d7da; color: #721c24; padding: 2px 4px; border-radius: 3px; text-decoration: line-through; }
        .diff-unchanged { color: #666; }
        .diff-line { margin: 2px 0; }
        .dup-highlight { background-color: #fff3cd; color: #856404; padding: 2px 4px; border-radius: 3px; font-weight: 600; }

        /* 账单计算器样式 */
        .bill-section { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .bill-section h2 { color: #555; margin-bottom: 12px; font-size: 16px; border-left: 4px solid #667eea; padding-left: 10px; }
        .bill-file-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .bill-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.3s; }
        .bill-btn-primary { background: #667eea; color: white; }
        .bill-btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .bill-btn-success { background: #48bb78; color: white; }
        .bill-btn-success:hover { background: #38a169; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4); }
        .bill-btn-warning { background: #ed8936; color: white; }
        .bill-btn-warning:hover { background: #dd6b20; }
        .bill-price-config { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
        .bill-price-item { background: white; padding: 12px; border-radius: 6px; border: 2px solid #e2e8f0; }
        .bill-price-item h3 { color: #667eea; margin-bottom: 8px; font-size: 14px; }
        .bill-price-input-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .bill-price-input-group label { min-width: 70px; color: #555; font-size: 13px; }
        .bill-price-input-group input { flex: 1; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 13px; }
        .bill-price-input-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .bill-table { width: 100%; border-collapse: collapse; margin-top: 12px; background: white; border-radius: 6px; overflow: hidden; }
        .bill-table th, .bill-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        .bill-table th { background: #667eea; color: white; font-weight: 600; position: sticky; top: 0; }
        .bill-table tr:hover { background: #f7fafc; }
        .bill-summary-row { background: #fef3c7 !important; font-weight: bold; }
        .bill-total-row { background: #667eea !important; color: white; font-weight: bold; }
        .bill-table-container { max-height: 400px; overflow-y: auto; margin-top: 12px; }
        .bill-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
        .bill-stat-card { background: white; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #667eea; }
        .bill-stat-card h3 { color: #718096; font-size: 13px; margin-bottom: 6px; }
        .bill-stat-card .value { color: #667eea; font-size: 20px; font-weight: bold; }
        .bill-message { padding: 10px; border-radius: 6px; margin-top: 8px; }
        .bill-message.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .bill-message.error { background: #fed7d7; color: #742a2a; border: 1px solid #fc8181; }
        .bill-hidden { display: none; }

        /* 启动加载覆盖层 */
        #splash-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #splash-overlay.fade-out { opacity: 0; pointer-events: none; }
        #splash-overlay .splash-title {
            font-size: 28px; font-weight: bold; color: white; margin-bottom: 20px;
        }
        #splash-overlay .splash-sub {
            font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 30px;
        }
        .splash-spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: white; border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;
        }
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        .splash-progress-track {
            width: 280px; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        .splash-progress-bar {
            height: 100%; width: 0%; background: white;
            border-radius: 2px; transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- 启动加载覆盖层 -->
    <div id="splash-overlay">
        <div class="splash-title">🛠️ YGP工具箱</div>
        <div class="splash-sub">正在加载资源...</div>
        <div class="splash-spinner"></div>
        <div class="splash-progress-track">
            <div class="splash-progress-bar" id="splash-progress-bar"></div>
        </div>
    </div>
    <div class="header">
        <h1>🛠️ YGP工具箱</h1>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title">工具列表</div>
            <button class="tool-btn active" data-tool="json">📋 JSON格式化</button>
            <button class="tool-btn" data-tool="list">📝 List格式化</button>
            <button class="tool-btn" data-tool="compress">🗜️ 文本压缩</button>
            <button class="tool-btn" data-tool="dedupe">🔄 文本去重</button>
            <button class="tool-btn" data-tool="sum">🔢 数字求和</button>
            <button class="tool-btn" data-tool="csv2xlsx">📊 CSV转Excel</button>
            <button class="tool-btn" data-tool="diff">🔍 文本差异对比</button>
            <button class="tool-btn" data-tool="sql">🗃️ SQL格式化</button>
            <button class="tool-btn" data-tool="kv2dict">📖 键值对转字典</button>
            <button class="tool-btn" data-tool="finddup">🔎 重复查找</button>
            <button class="tool-btn" data-tool="billcalc">📊 账单费用计算器</button>
        </div>
        <div class="main-content">
            <!-- 通用工具面板 -->
            <div class="panel" id="commonPanel">
                <div class="panel-header">
                    <div class="panel-title">原始文本</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearInput()">清空</button>
                        <button class="btn btn-secondary" onclick="pasteText()">粘贴</button>
                    </div>
                </div>
                <div id="dedupeModeTabs" style="display:none; margin-bottom:10px;">
                    <div class="input-mode-tabs">
                        <button class="mode-tab active" data-mode="line">按行去重</button>
                        <button class="mode-tab" data-mode="space">按空格去重</button>
                    </div>
                </div>
                <div id="compressModeTabs" style="display:none; margin-bottom:10px;">
                    <div class="input-mode-tabs">
                        <button class="mode-tab active" data-mode="space">换行转空格</button>
                        <button class="mode-tab" data-mode="remove">移除所有空白</button>
                        <button class="mode-tab" data-mode="newline">换行压缩</button>
                    </div>
                </div>
                <textarea id="inputText" placeholder="请输入文本..."></textarea>
            </div>
            <div class="center-btn" id="commonCenter">
                <button class="process-btn" onclick="processText()">处理 →</button>
            </div>
            <div class="panel" id="commonOutput">
                <div class="panel-header">
                    <div class="panel-title">输出结果</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearOutput()">清空</button>
                        <button class="btn btn-primary" onclick="copyResult()">复制结果</button>
                    </div>
                </div>
                <textarea id="outputText" placeholder="处理结果..." readonly></textarea>
            </div>

            <!-- 文本差异对比面板 -->
            <div class="panel" id="diffPanel" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">原文本</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearDiffInput()">清空</button>
                    </div>
                </div>
                <textarea id="diffOldText" placeholder="请输入原文本..." style="flex:1;"></textarea>
            </div>
            <div class="panel" id="diffRightPanel" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">新文本</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearDiffNewInput()">清空</button>
                    </div>
                </div>
                <textarea id="diffNewText" placeholder="请输入新文本..." style="flex:1;"></textarea>
            </div>
            <div class="center-btn" id="diffCenter" style="display:none;">
                <button class="process-btn" onclick="compareText()">对比 →</button>
            </div>
            <div class="panel" id="diffOutput" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">差异结果</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearDiffOutput()">清空</button>
                    </div>
                </div>
                <div id="diffResult" style="flex:1; overflow:auto; border:2px solid #e0e0e0; border-radius:8px; padding:12px; font-family:'Consolas','Monaco',monospace; font-size:13px; line-height:1.6; background:#fafafa;"></div>
            </div>

            <!-- 重复查找面板 -->
            <div class="panel" id="finddupPanel" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">文本A</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearFinddupA()">清空</button>
                    </div>
                </div>
                <textarea id="finddupTextA" placeholder="请输入文本A..." style="flex:1;"></textarea>
            </div>
            <div class="panel" id="finddupRightPanel" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">文本B</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearFinddupB()">清空</button>
                    </div>
                </div>
                <textarea id="finddupTextB" placeholder="请输入文本B..." style="flex:1;"></textarea>
            </div>
            <div class="center-btn" id="finddupCenter" style="display:none;">
                <button class="process-btn" onclick="findDuplicates()">查找 →</button>
            </div>
            <div class="panel" id="finddupOutput" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">重复结果</div>
                    <div class="panel-actions">
                        <button class="btn btn-secondary" onclick="clearFinddupOutput()">清空</button>
                    </div>
                </div>
                <div id="finddupResult" style="flex:1; overflow:auto; border:2px solid #e0e0e0; border-radius:8px; padding:12px; font-family:'Consolas','Monaco',monospace; font-size:13px; line-height:1.6; background:#fafafa;"></div>
            </div>

            <!-- CSV转Excel专用面板 -->
            <div class="panel" id="csvPanel" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">CSV输入</div>
                    <div class="panel-actions">
                        <div class="input-mode-tabs">
                            <button class="mode-tab active" onclick="switchCsvMode('file')">上传文件</button>
                            <button class="mode-tab" onclick="switchCsvMode('text')">粘贴文本</button>
                        </div>
                    </div>
                </div>
                <div id="csvFileMode" style="flex:1; display:flex; flex-direction:column;">
                    <div class="csv-upload-area" id="csvDropZone" onclick="document.getElementById('csvFileInput').click()">
                        <input type="file" id="csvFileInput" accept=".csv,.txt" onchange="handleCsvFile(event)">
                        <div style="font-size:24px; margin-bottom:8px;">📁</div>
                        <div>点击选择CSV文件 或 拖拽文件到此处</div>
                    </div>
                    <div class="csv-file-info" id="csvFileInfo">未选择文件</div>
                    <textarea id="csvTextPreview" placeholder="文件预览..." readonly style="flex:1; min-height:100px;"></textarea>
                </div>
                <div id="csvTextMode" style="flex:1; display:none; flex-direction:column;">
                    <textarea id="csvTextInput" placeholder="请粘贴CSV文本内容..." style="flex:1;"></textarea>
                </div>
            </div>
            <div class="center-btn" id="csvCenter" style="display:none;">
                <button class="process-btn" onclick="convertCsv2Xlsx()">转换 →</button>
            </div>
            <div class="panel" id="csvOutput" style="display:none;">
                <div class="panel-header">
                    <div class="panel-title">转换结果</div>
                    <div class="panel-actions">
                        <button class="download-btn" id="downloadXlsxBtn" onclick="downloadXlsx()" disabled>⬇ 下载XLSX</button>
                    </div>
                </div>
                <textarea id="csvOutputText" placeholder="转换预览..." readonly style="flex:1;"></textarea>
            </div>

            <!-- 账单费用计算器面板 -->
            <div class="panel" id="billPanel" style="display:none; overflow-y:auto;">
                <!-- 文件导入导出 -->
                <div class="bill-section">
                    <h2>📁 文件操作</h2>
                    <div class="bill-file-controls">
                        <label class="bill-btn bill-btn-primary">
                            导入账单文件
                            <input type="file" id="billFile" accept=".xlsx,.xls,.csv" style="display:none;">
                        </label>
                        <label class="bill-btn bill-btn-warning">
                            导入单价配置
                            <input type="file" id="configFile" accept=".json" style="display:none;">
                        </label>
                        <button class="bill-btn bill-btn-success" id="billExportBtn" disabled>导出计算结果</button>
                        <button class="bill-btn bill-btn-warning" id="billResetBtn">重置</button>
                    </div>
                    <div id="billFileMessage"></div>
                </div>

                <!-- 模型单价配置 -->
                <div class="bill-section">
                    <h2>⚙️ 模型单价配置（单位：元/百万token）</h2>
                    <div class="bill-price-config" id="billPriceConfig"></div>
                    <button class="bill-btn bill-btn-primary" id="billSaveConfigBtn" style="margin-top: 12px;">保存配置为JSON</button>
                </div>

                <!-- 数据统计 -->
                <div class="bill-section bill-hidden" id="billStatsSection">
                    <h2>📈 统计概览</h2>
                    <div class="bill-stats" id="billStatsContainer"></div>
                </div>

                <!-- 详细计算结果 -->
                <div class="bill-section bill-hidden" id="billDetailSection">
                    <h2>📋 详细计算结果（按月份、应用、模型）</h2>
                    <div class="bill-table-container">
                        <table class="bill-table" id="billDetailTable">
                            <thead>
                                <tr>
                                    <th>月份</th>
                                    <th>应用</th>
                                    <th>模型</th>
                                    <th>缓存Token</th>
                                    <th>输入Token</th>
                                    <th>输出Token</th>
                                    <th>小计（元）</th>
                                </tr>
                            </thead>
                            <tbody id="billDetailBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 汇总结果 -->
                <div class="bill-section bill-hidden" id="billSummarySection">
                    <h2>💰 汇总结果（按月份、应用）</h2>
                    <div class="bill-table-container">
                        <table class="bill-table" id="billSummaryTable">
                            <thead>
                                <tr>
                                    <th>业务领域</th>
                                    <th>订阅名称</th>
                                    <th>费用（人民币）</th>
                                    <th>南天门账单费用（人民币）</th>
                                    <th>总费用</th>
                                    <th>对接人</th>
                                    <th>确认无误</th>
                                    <th>部门</th>
                                </tr>
                            </thead>
                            <tbody id="billSummaryBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ======= 启动加载管理 =======
        var _loadedCount = 0;
        var _totalScripts = 2;
        var _libsReady = false;
        function markScriptLoaded() {
            _loadedCount++;
            var pct = Math.min(90, Math.round((_loadedCount / _totalScripts) * 90));
            var bar = document.getElementById('splash-progress-bar');
            if (bar) bar.style.width = pct + '%';
            if (_loadedCount >= _totalScripts) {
                _libsReady = true;
                setTimeout(function() {
                    var bar2 = document.getElementById('splash-progress-bar');
                    if (bar2) bar2.style.width = '100%';
                    setTimeout(function() {
                        var overlay = document.getElementById('splash-overlay');
                        if (overlay) {
                            overlay.classList.add('fade-out');
                            setTimeout(function() { overlay.style.display = 'none'; }, 500);
                        }
                    }, 200);
                }, 300);
            }
        }
        // 紧急后备：8秒后强制关闭加载层
        setTimeout(function() {
            var overlay = document.getElementById('splash-overlay');
            if (overlay && window.getComputedStyle(overlay).display !== 'none') {
                overlay.classList.add('fade-out');
                setTimeout(function() { overlay.style.display = 'none'; }, 500);
            }
        }, 8000);

        // 动态加载两个大库，不阻塞主线程
        function _loadLib(src, callback) {
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.onload = callback;
            s.onerror = function() {
                // 本地加载失败，降级到CDN
                var cdnSrc = '';
                if (src.indexOf('xlsx') > -1) {
                    cdnSrc = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
                } else if (src.indexOf('sql-formatter') > -1) {
                    cdnSrc = 'https://cdn.jsdelivr.net/npm/sql-formatter@12.2.0/dist/sql-formatter.min.js';
                }
                if (cdnSrc) {
                    var s2 = document.createElement('script');
                    s2.src = cdnSrc;
                    s2.async = true;
                    s2.onload = callback;
                    document.body.appendChild(s2);
                }
            };
            document.body.appendChild(s);
        }
        // 先让页面事件绑定完成，再延迟加载库
        setTimeout(function() {

        // 使用 SheetJS 前端转换（降级方案，非 pywebview 环境使用）
        function convertWithSheetJS(csvText) {
            // 使用 cellDates: true 让 SheetJS 自动将日期字符串转为 Date 对象
            var workbook = XLSX.read(csvText, { type: 'string', cellDates: true });
            var sheetName = workbook.SheetNames[0];
            var sheet = workbook.Sheets[sheetName];
            var jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

            // 检测日期列并设置格式
            var colCount = jsonData[0] ? jsonData[0].length : 0;
            var dateColFormats = {};
            for (var col = 0; col < colCount; col++) {
                var dateCount = 0, total = 0, hasTime = false;
                var sample = Math.min(20, jsonData.length - 1);
                for (var row = 1; row <= sample; row++) {
                    var val = jsonData[row] && jsonData[row][col];
                    if (val === undefined || val === null || val === '') continue;
                    total++;
                    if (val instanceof Date) {
                        dateCount++;
                        if (val.getHours() || val.getMinutes() || val.getSeconds()) hasTime = true;
                    } else if (typeof val === 'string') {
                        var trimmed = val.trim();
                        if (/^\d{4}[-\/]\d{2}[-\/]\d{2}/.test(trimmed)) {
                            dateCount++;
                            if (/\d{2}:\d{2}/.test(trimmed)) hasTime = true;
                        }
                    }
                }
                if (total > 0 && dateCount / total >= 0.6) {
                    dateColFormats[col] = hasTime ? 'yyyy-mm-dd hh:mm:ss' : 'yyyy-mm-dd';
                }
            }

            // 重写工作表，为日期单元格设置格式
            if (Object.keys(dateColFormats).length > 0) {
                var newSheet = {};
                var range = { s: { r: 0, c: 0 }, e: { r: jsonData.length - 1, c: colCount - 1 } };
                newSheet['!ref'] = XLSX.utils.encode_range(range);
                if (sheet['!cols']) newSheet['!cols'] = sheet['!cols'];

                for (var r = 0; r < jsonData.length; r++) {
                    var row = jsonData[r] || [];
                    for (var c = 0; c < colCount; c++) {
                        var addr = XLSX.utils.encode_cell({ r: r, c: c });
                        var val = row[c];

                        if (dateColFormats[c] && r > 0 && val !== '' && val !== undefined && val !== null) {
                            var dateVal = null;
                            if (val instanceof Date) {
                                dateVal = val;
                            } else if (typeof val === 'string') {
                                // 解析字符串日期
                                var s = val.trim().replace(/-/g, '/');
                                var d = new Date(s);
                                if (!isNaN(d.getTime())) dateVal = d;
                            }
                            if (dateVal) {
                                newSheet[addr] = {
                                    t: 'd',
                                    v: dateVal,
                                    z: dateColFormats[c]
                                };
                                continue;
                            }
                        }

                        // 其他单元格
                        if (typeof val === 'number') {
                            newSheet[addr] = { t: 'n', v: val };
                        } else if (val !== undefined && val !== null) {
                            newSheet[addr] = { t: 's', v: String(val) };
                        }
                    }
                }
                workbook.Sheets[sheetName] = newSheet;
            }

            var preview = '工作表: ' + sheetName + '\n';
            preview += '行数: ' + (jsonData.length - 1) + '\n\n';
            preview += '--- 数据预览 ---\n';
            var maxPreview = Math.min(jsonData.length - 1, 50);
            for (var i = 1; i <= maxPreview; i++) {
                var row = jsonData[i] || [];
                var parts = [];
                for (var c = 0; c < colCount; c++) {
                    var v = row[c];
                    if (v instanceof Date) {
                        var fmt = dateColFormats[c] || '';
                        var y = v.getFullYear();
                        var M = String(v.getMonth() + 1).padStart(2, '0');
                        var d = String(v.getDate()).padStart(2, '0');
                        if (fmt.indexOf('hh') >= 0) {
                            var h = String(v.getHours()).padStart(2, '0');
                            var m = String(v.getMinutes()).padStart(2, '0');
                            var s = String(v.getSeconds()).padStart(2, '0');
                            parts.push(y + '-' + M + '-' + d + ' ' + h + ':' + m + ':' + s);
                        } else {
                            parts.push(y + '-' + M + '-' + d);
                        }
                    } else {
                        parts.push(v === undefined || v === null ? '' : String(v));
                    }
                }
                preview += i + '| ' + parts.join('\t') + '\n';
            }
            if (jsonData.length - 1 > 50) {
                preview += '... 共 ' + (jsonData.length - 1) + ' 行，仅预览前50行\n';
            }
            preview += '\n✅ 转换成功！点击"下载XLSX"按钮保存文件';

            csvWorkbook = workbook;
            csvXlsxBase64 = null;
            document.getElementById('csvOutputText').value = preview;
            document.getElementById('downloadXlsxBtn').disabled = false;
        }

        // 下载XLSX
        function downloadXlsx() {
            try {
                // 优先使用 Python pandas 转换的结果
                if (csvXlsxBase64) {

                        window.pywebview.api.save_xlsx_file({

                            }
                        }).catch(function(err) {
                            alert('保存失败: ' + err.message);
                        });
                    } else {
                        // 浏览器环境：base64 → Blob → 下载
                        var byteChars = atob(csvXlsxBase64);
                        var byteNums = new Uint8Array(byteChars.length);
                        for (var i = 0; i < byteChars.length; i++) {
                            byteNums[i] = byteChars.charCodeAt(i);
                        }
                        var blob = new Blob([byteNums], {
                            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                        });
                        var link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = csvFileName + '.xlsx';
                        link.click();
                    }
                    return;
                }

                // 降级：SheetJS 转换
                if (!csvWorkbook) return;
                var xlsxData = XLSX.write(csvWorkbook, { bookType: 'xlsx', type: 'array' });
                var base64Content = arrayBufferToBase64(xlsxData);

                if (window.pywebview) {
                    window.pywebview.api.save_xlsx_file({
                        filename: csvFileName + '.xlsx',
                        content: base64Content
                    }).then(function(result) {
                        if (result.success) {
                            alert('文件保存成功: ' + result.path);
                        } else {
                            alert(result.message || '保存失败');
                        }
                    }).catch(function(err) {
                        alert('保存失败: ' + err.message);
                    });
                } else {
                    XLSX.writeFile(csvWorkbook, csvFileName + '.xlsx');
                }
            } catch (e) {
                alert('下载失败: ' + e.message);
            }
        }

        // ArrayBuffer转Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // JSON格式化 - 支持标准JSON和Python风格JSON
        function formatJSON(text) {
            if (!text.trim()) return '';
            
            let normalized = text.trim();
            
            // 尝试直接解析标准JSON
            try {
                let parsed = JSON.parse(normalized);
                return JSON.stringify(parsed, null, 2);
            } catch (e) {
                // 如果标准JSON解析失败，尝试处理Python风格
            }
            
            // 处理Python风格的字典/列表
            // 1. 先将字符串内容中的反斜杠转义保存
            normalized = normalized.replace(/\\\\/g, '____ESCAPED_BACKSLASH____');
            
            // 2. 将Python字面量转换为JSON格式
            normalized = normalized.replace(/\bNone\b/g, 'null');
            normalized = normalized.replace(/\bTrue\b/g, 'true');
            normalized = normalized.replace(/\bFalse\b/g, 'false');
            
            // 3. 处理字符串中的单引号：先将字符串内容中的单引号临时替换
            // 匹配引号内的内容，保护内部的引号
            normalized = normalized.replace(/'([^']*)'/g, function(match, content) {
                // 将内容中的双引号转义
                content = content.replace(/"/g, '____ESCAPED_QUOTE____');
                // 将单引号替换为双引号
                return '"' + content + '"';
            });
            
            // 4. 恢复反斜杠
            normalized = normalized.replace(/____ESCAPED_BACKSLASH____/g, '\\\\');
            normalized = normalized.replace(/____ESCAPED_QUOTE____/g, '\\"');
            
            // 5. 尝试解析
            try {
                let parsed = JSON.parse(normalized);
                return JSON.stringify(parsed, null, 2);
            } catch (e) {
                // 如果还是失败，尝试更宽松的处理
                return 'JSON解析错误: ' + e.message + '\n\n提示: 请检查输入是否为有效的JSON或Python字典格式';
            }
        }

        // List格式化 - 多行文本转列表
        function formatList(text) {
            if (!text.trim()) return '';
            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) return '';
            
            return JSON.stringify(lines, null, 2);
        }

        // 文本压缩 - 支持换行转空格、移除所有空白和移除空白行
        function compressText(text) {
            if (!text.trim()) return '';
            if (compressMode === 'remove') {
                // 移除所有空格和换行
                return text.replace(/\s+/g, '');
            } else if (compressMode === 'newline') {
                // 移除空白行，保留内容行间的单个换行
                return text.split('\n')
                    .filter(line => line.trim().length > 0)
                    .join('\n');
            } else {
                // 换行替换为空格（默认）
                let result = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .join(' ');
                // 清理 { 后面和 } 前面的多余空格
                result = result.replace(/\{\s+/g, '{');
                result = result.replace(/\s+\}/g, '}');
                return result;
            }
        }

        // 文本去重 - 支持按行去重和按空格去重
        function dedupeText(text) {
            if (!text.trim()) return '';
            let items, separator;
            if (dedupeMode === 'space') {
                items = text.split(/\s+/).filter(item => item.length > 0);
                separator = ' ';
            } else {
                items = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                separator = '\n';
            }
            const seen = new Set();
            const unique = [];
            let dupCount = 0;
            items.forEach(item => {
                if (!seen.has(item)) {
                    seen.add(item);
                    unique.push(item);
                } else {
                    dupCount++;
                }
            });
            let result = unique.join(separator);
            result += `\n\n--- 去重统计 ---\n原始: ${items.length} 项 | 去重后: ${unique.length} 项 | 重复: ${dupCount} 项`;
            return result;
        }

        // 数字求和 - 支持换行和空格分隔的数字
        function sumNumbers(text) {
            if (!text.trim()) return '';
            
            // 提取所有数字(包括整数和小数)
            const numbers = text.match(/-?\d+\.?\d*/g);
            
            if (!numbers || numbers.length === 0) {
                return '未找到有效数字';
            }
            
            const nums = numbers.map(n => parseFloat(n));
            const sum = nums.reduce((acc, val) => acc + val, 0);
            
            // 输出详细信息
            let result = `找到 ${nums.length} 个数字:\n`;
            result += nums.join(' + ') + '\n';
            result += `总和 = ${sum}`;
            
            return result;
        }

        function formatSQL(text) {
            if (!text.trim()) return '';
            
            try {
                return sqlFormatter.format(text, {
                    language: 'sql',
                    tabWidth: 2,
                    keywordCase: 'upper',
                    indentStyle: 'standard',
                    linesBetweenQueries: 2
                });
            } catch (e) {
                return 'SQL格式化错误: ' + e.message;
            }
        }

        // 键值对转字典 - 将键值对文本转换为Python字典格式
        function formatKeyValue2Dict(text) {
            if (!text.trim()) return '';
            
            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) return '';
            
            const entries = [];
            let errorCount = 0;
            
            lines.forEach((line, idx) => {
                // 支持tab分隔或多个空格分隔
                const parts = line.split(/\t+|\s{2,}/);
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    const value = parts.slice(1).join(' ').trim();
                    entries.push(`"${key}":"${value}"`);
                } else {
                    errorCount++;
                }
            });
            
            if (entries.length === 0) {
                return '错误: 未找到有效的键值对，请确保每行包含用Tab或多个空格分隔的键和值';
            }
            
            let result = '{' + entries.join(',') + '}';
            
            if (errorCount > 0) {
                result += `\n\n⚠ 警告: ${errorCount} 行未能识别为有效键值对`;
            }
            
            return result;
        }

        // 文本差异对比
        function compareText() {
            const oldText = document.getElementById('diffOldText').value;
            const newText = document.getElementById('diffNewText').value;

            if (!oldText.trim() && !newText.trim()) {
                document.getElementById('diffResult').innerHTML = '<div style="color:#888;text-align:center;padding:20px;">请输入原文本和新文本</div>';
                return;
            }

            const oldLines = oldText.split('\n');
            const newLines = newText.split('\n');

            // 使用LCS算法计算差异
            const diff = computeDiff(oldLines, newLines);
            const html = renderDiff(diff);

            document.getElementById('diffResult').innerHTML = html;
        }

        // 计算LCS差异
        function computeDiff(oldLines, newLines) {
            const m = oldLines.length;
            const n = newLines.length;

            // 构建DP表
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (oldLines[i - 1] === newLines[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // 回溯找出差异
            const result = [];
            let i = m, j = n;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
                    result.unshift({ type: 'unchanged', line: oldLines[i - 1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    result.unshift({ type: 'added', line: newLines[j - 1] });
                    j--;
                } else if (i > 0) {
                    result.unshift({ type: 'removed', line: oldLines[i - 1] });
                    i--;
                }
            }

            return result;
        }

        // 渲染差异结果
        function renderDiff(diff) {
            let html = '';
            let lineNum = 1;

            diff.forEach(item => {
                const lineContent = escapeHtml(item.line) || '&nbsp;';
                if (item.type === 'added') {
                    html += `<div class="diff-line diff-added">+ ${lineContent}</div>`;
                } else if (item.type === 'removed') {
                    html += `<div class="diff-line diff-removed">- ${lineContent}</div>`;
                } else {
                    html += `<div class="diff-line diff-unchanged">${lineNum} | ${lineContent}</div>`;
                    lineNum++;
                }
            });

            return html;
        }

                const cls = isDup ? 'dup-highlight' : '';
                html += `<span class="${cls}" style="margin:2px 4px;padding:2px 6px;display:inline-block;">${fieldContent}</span>`;

            html += '<div style="margin-top:16px;">';

        function billHandleBillFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            billShowMessage('正在读取文件...', 'success');

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                    if (jsonData.length === 0) {
                        billShowMessage('文件为空', 'error');
                        return;
                    }

                    billData = jsonData;
                    billShowMessage(`成功导入 ${jsonData.length} 条记录`, 'success');

                    const models = [...new Set(jsonData.map(row => row['模型']))];
                    models.forEach(model => billAddModel(model));

                    billCalculateCosts();
                    document.getElementById('billExportBtn').disabled = false;

                } catch (error) {
                    billShowMessage('文件读取失败: ' + error.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

            reader.onload = function(event) {
                try {

                    billLoadPriceConfig(config);
                    billShowMessage('单价配置导入成功', 'success');

                    if (billData.length > 0) {
                        billCalculateCosts();
                    }
                } catch (error) {
                    billShowMessage('配置文件读取失败: ' + error.message, 'error');
                }
            };
            reader.readAsText(file);
        }

        function billCalculateCosts() {
            const grouped = {};
            const invalidRows = [];

            billData.forEach((row, index) => {
                const date = row['日期'];
                const app = row['应用'];
                const model = row['模型'];

                if (!date || !app || !model) {
                    invalidRows.push(index + 2);
                    return;
                }

                const month = String(date).substring(0, 7);
                const key = `${month}|${app}|${model}`;

                if (!grouped[key]) {
                    grouped[key] = {
                        month,
                        app,
                        model,
                        cacheToken: 0,
                        inputToken: 0,
                        outputToken: 0
                    };
                }

                grouped[key].cacheToken += parseFloat(row['缓存token'] || 0);
                grouped[key].inputToken += parseFloat(row['输入token'] || 0);
                grouped[key].outputToken += parseFloat(row['输出token'] || 0);
            });

            if (invalidRows.length > 0) {
                billShowMessage(`警告: 以下行数据不完整已跳过: ${invalidRows.slice(0, 10).join(', ')}${invalidRows.length > 10 ? '...' : ''}`, 'error');
            }

            billCalculatedData = Object.values(grouped).map(item => {
                const prices = billPriceConfig[item.model];
                if (!prices) {
                    billShowMessage(`警告: 模型 ${item.model} 未配置单价`, 'error');
                    return { ...item, subtotal: 0 };
                }

                const subtotal = 
                    (item.inputToken - item.cacheToken) / 1000000 * prices.input +
                    item.outputToken / 1000000 * prices.output +
                    item.cacheToken / 1000000 * prices.cache;

                return { ...item, subtotal };
            });

            const summaryGrouped = {};
            billCalculatedData.forEach(item => {
                const key = `${item.month}|${item.app}`;
                if (!summaryGrouped[key]) {
                    const appInfo = billAppConfig[item.app] || { name: '未知应用', contact: '未知' };
                    summaryGrouped[key] = {
                        month: item.month,
                        app: item.app,
                        businessDomain: appInfo.name,
                        contact: appInfo.contact,
                        totalCost: 0
                    };
                }
                summaryGrouped[key].totalCost += item.subtotal;
            });

            billSummaryData = Object.values(summaryGrouped);
            billRenderResults();
        }

            const totalRow = document.createElement('tr');
            totalRow.className = 'bill-total-row';
            const grandTotal = billSummaryData.reduce((sum, item) => sum + item.totalCost, 0);
            totalRow.innerHTML = `
                <td>总计</td>
                <td></td>
                <td>0</td>
                <td>¥${grandTotal.toFixed(2)}</td>
                <td>¥${grandTotal.toFixed(2)}</td>
                <td></td>
                <td></td>
                <td></td>
            `;
            summaryBody.appendChild(totalRow);
        }

        function billFormatNumber(num) {
            return num.toLocaleString('zh-CN', { maximumFractionDigits: 0 });
        }

        function billExportResults() {
            const wb = XLSX.utils.book_new();

            const detailWS = XLSX.utils.json_to_sheet(billCalculatedData.map(item => ({
                '月份': item.month,
                '应用': item.app,
                '模型': item.model,
                '缓存Token': item.cacheToken,
                '输入Token': item.inputToken,
                '输出Token': item.outputToken,
                '小计（元）': item.subtotal.toFixed(2)
            })));
            XLSX.utils.book_append_sheet(wb, detailWS, '详细计算结果');

            const monthGroups = {};
            billSummaryData.forEach(item => {
                if (!monthGroups[item.month]) {
                    monthGroups[item.month] = [];
                }
                monthGroups[item.month].push(item);
            });

            Object.keys(monthGroups).sort().forEach(month => {
                const monthData = monthGroups[month];
                const monthWS = XLSX.utils.json_to_sheet(monthData.map(item => ({
                    '业务领域': item.businessDomain,
                    '订阅名称': '',
                    '费用（人民币）': 0,
                    '南天门账单费用（人民币）': item.totalCost.toFixed(2),
                    '总费用': item.totalCost.toFixed(2),
                    '对接人': item.contact,
                    '确认无误': '',
                    '部门': ''
                })));

                const grandTotal = monthData.reduce((sum, item) => sum + item.totalCost, 0);
                const totalRow = [
                    { v: '总计' },
                    { v: '' },
                    { v: 0 },
                    { v: grandTotal.toFixed(2) },
                    { v: grandTotal.toFixed(2) },
                    { v: '' },
                    { v: '' },
                    { v: '' }
                ];
                
                const rowCount = monthWS['!ref'] ? XLSX.utils.decode_range(monthWS['!ref']).e.r + 1 : 0;
                totalRow.forEach((cell, colIndex) => {
                    const cellRef = XLSX.utils.encode_cell({ r: rowCount, c: colIndex });
                    monthWS[cellRef] = cell;
                });

                const sheetName = month.replace('-', '');
                XLSX.utils.book_append_sheet(wb, monthWS, sheetName);
            });

            const date = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `账单计算结果_${date}.xlsx`);
            billShowMessage('导出成功', 'success');
        }

        function billSaveConfigToFile() {
            const configStr = JSON.stringify(billPriceConfig, null, 2);
            const blob = new Blob([configStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'price_config.json';
            a.click();
            URL.revokeObjectURL(url);
            billShowMessage('配置已保存', 'success');
        }

        function billShowMessage(msg, type) {
            const fileMessage = document.getElementById('billFileMessage');
            fileMessage.innerHTML = `<div class="bill-message ${type}">${msg}</div>`;
            setTimeout(() => {
                fileMessage.innerHTML = '';
            }, 3000);
        }

        // 初始化账单计算器
        billInit();
    </script>
</body>
</html>
